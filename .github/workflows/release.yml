name: Release

# Publishes a release to GitHub Releases and signs its update manifest (DEC-031, TD-054).
# Started by pushing a tag such as v0.1.0 that matches <Version> in Directory.Build.props.
#
# One-time setup by the product owner (docs/22-operations-runbook.md §7):
#   - Repository variable FREEALL_UPDATE_PUBLIC_KEY: the public key printed by tools/updates/New-UpdateKey.ps1.
#   - Environment "release" with required reviewer(s), limited to tags v*, holding the secrets
#     FREEALL_UPDATE_SIGNING_KEY (the encrypted PEM text) and FREEALL_UPDATE_SIGNING_PASSWORD.
#
# The build runs without the signing secrets. Only the sign-and-publish job, which waits for a reviewer's
# approval, can read them, and it runs nothing from the build except the setup file it checks and signs.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  FREEALL_UPDATE_MANIFEST_URL: ${{ vars.FREEALL_UPDATE_MANIFEST_URL || format('https://github.com/{0}/releases/latest/download/manifest.json', github.repository) }}
  FREEALL_UPDATE_PUBLIC_KEY: ${{ vars.FREEALL_UPDATE_PUBLIC_KEY }}

jobs:
  build:
    name: Build, test and package (x64)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Check the tag and the update key
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          # The tag comes in through the environment, never pasted into the script.
          if ("v$version" -cne $env:GITHUB_REF_NAME) { throw "The tag $env:GITHUB_REF_NAME doesn't match <Version>$version</Version> in Directory.Build.props." }
          if ([string]::IsNullOrWhiteSpace($env:FREEALL_UPDATE_PUBLIC_KEY)) { throw 'The repository variable FREEALL_UPDATE_PUBLIC_KEY is not set, so this release could never check for updates.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build, test and publish
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Locked -Publish

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-x64
          path: artifacts/release
          if-no-files-found: error

  publish:
    name: Sign the update manifest and publish
    needs: build
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }} # only ever read as $env:TAG
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-x64
          path: artifacts/release

      - name: Check the setup file against the build's checksums
        shell: pwsh
        run: |
          Set-Location artifacts/release
          foreach ($line in Get-Content SHA256SUMS.txt) {
            $hash, $name = $line -split '\s+\*?', 2
            if ((Get-FileHash $name -Algorithm SHA256).Hash -ne $hash) { throw "$name doesn't match SHA256SUMS.txt." }
          }

      - name: Sign the update manifest
        shell: pwsh
        env:
          FREEALL_UPDATE_SIGNING_KEY: ${{ secrets.FREEALL_UPDATE_SIGNING_KEY }}
          FREEALL_UPDATE_SIGNING_PASSWORD: ${{ secrets.FREEALL_UPDATE_SIGNING_PASSWORD }}
        run: |
          if (-not $env:FREEALL_UPDATE_SIGNING_KEY -or -not $env:FREEALL_UPDATE_SIGNING_PASSWORD) { throw 'The release environment has no signing key or password.' }
          $setup = "artifacts/release/FreeAll-Setup-$env:VERSION-x64.exe"
          $password = ConvertTo-SecureString $env:FREEALL_UPDATE_SIGNING_PASSWORD -AsPlainText -Force
          # Seconds since 1970: always larger than any earlier release's or refresh's sequence.
          $sequence = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          ./tools/updates/New-UpdateManifest.ps1 -SetupPath $setup -Version $env:VERSION `
            -PackageUrl "https://github.com/${{ github.repository }}/releases/download/$env:TAG/FreeAll-Setup-$env:VERSION-x64.exe" `
            -Sequence $sequence -PrivateKeyPem $env:FREEALL_UPDATE_SIGNING_KEY -Password $password -OutputDirectory artifacts/update `
            -Notes "FreeAll $env:VERSION. Release notes: https://github.com/${{ github.repository }}/releases/tag/$env:TAG"
          ./tools/updates/Test-UpdateManifest.ps1 -ManifestPath artifacts/update/manifest.json -SignaturePath artifacts/update/manifest.json.sig `
            -PublicKey $env:FREEALL_UPDATE_PUBLIC_KEY -SetupPath $setup | Format-List

      - name: Publish the release
        shell: pwsh
        run: |
          $notes = "artifacts/release-notes.md"
          $text = Get-Content docs/25-release-notes.md -Raw
          $match = [regex]::Match($text, "(?ms)^## $([regex]::Escape($env:VERSION)) .*?(?=^## |\z)")
          Set-Content $notes ($(if ($match.Success) { $match.Value } else { "FreeAll $env:VERSION. See docs/25-release-notes.md." })) -Encoding utf8
          # PowerShell doesn't expand wildcards for programs, so the files are listed.
          $files = @((Get-ChildItem artifacts/release -File).FullName) + @((Get-ChildItem artifacts/update -File).FullName)
          gh release create $env:TAG --verify-tag --title "FreeAll $env:VERSION" --notes-file $notes @files
