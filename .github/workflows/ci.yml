name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Build and test (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build, test and publish
        shell: pwsh
        # Public values (an address and a public key). Without them the build simply can't check for updates.
        env:
          FREEALL_UPDATE_MANIFEST_URL: ${{ vars.FREEALL_UPDATE_MANIFEST_URL }}
          FREEALL_UPDATE_PUBLIC_KEY: ${{ vars.FREEALL_UPDATE_PUBLIC_KEY }}
        run: ./build.ps1 -Configuration Release -Locked -Publish

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-x64
          path: artifacts/release
          if-no-files-found: error
